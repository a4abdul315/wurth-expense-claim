# Netlify deployment config for Würth Expense Claim System (frontend only)
# The backend (Express + MySQL) must be deployed separately on Railway / Render / VPS
# and its URL set as the NEXT_PUBLIC_API_URL environment variable in Netlify.

[build]
  # Build from the frontend folder
  base    = "frontend"
  command = "npm install && npm run build"
  publish = ".next"

# Netlify Next.js plugin — handles SSR, API routes, and redirects automatically
[[plugins]]
  package = "@netlify/plugin-nextjs"

# Environment variables (set real values in Netlify dashboard → Site → Environment)
[build.environment]
  NODE_VERSION = "20"
  # Set this to your deployed backend URL (Railway / Render / VPS)
  # NEXT_PUBLIC_API_URL = "https://your-backend.railway.app/api"

# Redirect root → login (fallback in case Next.js middleware doesn't catch it)
[[redirects]]
  from   = "/"
  to     = "/login"
  status = 302
